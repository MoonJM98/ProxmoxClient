# 배포 — v* 태그를 올리면 서명한 APK 를 만들어 초안(draft) 릴리스에 붙인다. 공개는 사람이 확인한 뒤 GitHub 에서 한다.
#
# 저장소 Secrets(Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   업로드 키스토어(.jks/.keystore)를 base64 로 인코딩한 값  (base64 -w0 release.keystore)
#   ANDROID_KEYSTORE_PASSWORD 키스토어 비밀번호
#   ANDROID_KEY_ALIAS         키 별칭
#   ANDROID_KEY_PASSWORD      키 비밀번호(키스토어 비밀번호와 같으면 같은 값)
# ProxmoxClient.Android.csproj 는 환경 변수 ANDROID_KEYSTORE_PATH·ANDROID_KEYSTORE_PASSWORD·ANDROID_KEY_ALIAS·
# ANDROID_KEY_PASSWORD 로 서명 설정을 읽는다. 아래에서는 같은 값을 MSBuild 속성으로도 넘겨 확실히 서명되게 한다.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스 태그(예: v1.0.4) — 이미 있는 태그"
        required: true

permissions:
  contents: write # 초안 릴리스 만들기

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  android:
    name: Android 서명 APK → 초안 릴리스
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: android 워크로드 설치
        run: dotnet workload install android

      - name: Android SDK 의존성
        run: >
          dotnet build ProxmoxClient.Android -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" -p:AcceptAndroidSDKLicenses=True

      - name: 키스토어 풀기
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 비밀값이 없습니다 — 서명 없이는 배포 APK 를 만들지 않습니다."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: 서명 APK 만들기
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # 비밀번호는 env: 접두사로 넘겨 명령 줄·로그에 값이 남지 않게 한다
        run: >
          dotnet publish ProxmoxClient.Android -c Release -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="$ANDROID_KEYSTORE_PATH"
          -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD
          -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
          -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD
          -o artifacts/android

      - name: 산출물 이름 정리
        run: |
          mkdir -p dist
          apk=$(ls artifacts/android/*-Signed.apk | head -n 1)
          cp "$apk" "dist/ProxmoxClient-${TAG}-android.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist

      - name: 키스토어 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.TAG }}
          path: dist/
          if-no-files-found: error

      # 같은 태그의 릴리스가 이미 있으면 파일만 바꿔 올린다(초안 상태는 건드리지 않음)
      - name: 초안 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --generate-notes --title "ProxmoxClient $TAG" --verify-tag
          fi
